<title>CXR Tuberculosis 2021 Yaushev</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the Iren test-player window - question strip on top, scrolling question in the middle,
   control bar at the bottom; results as three tabs. Deliberately a single light "Windows" look. */
:root{
  --face:#f0f0f0; --win:#ffffff; --ink:#000000; --ink-dim:#6d6d6d; --line:#a0a0a0; --q-border:#9e9e9e;
  --sel:#99ccff; --ans:#0066ff; --unans:#808080; --cur:#800000; --ok:#00e000; --bad:#e00000;
  --timer:#aaccff; --cat:#d0d0d0; --slot:#a0a0a0; --grey-label:#a6a6a6; --pie:#c0c0c0;
  --btn:#e1e1e1; --btn-b:#adadad; --hov:#e5f1fb; --focus:#0078d7; --dis-bg:#cccccc; --dis-b:#bfbfbf; --dis-ink:#8a8a8a;
  --list-sel:#3096fa; --shade:rgba(0,0,0,.2); --red:#ff0000;
  --f-ui:"Segoe UI",Tahoma,system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --f-q:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --fs-ui:12px; --fs-q:16px; --btn-h:23px; --sq-h:16px;
  color-scheme:light;
}
@media (pointer:coarse){ :root{ --fs-ui:15px; --btn-h:36px; --sq-h:22px; } }
html{box-sizing:border-box;height:100%;background:var(--face)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;overflow:hidden;background:var(--face);color:var(--ink);
  font:var(--fs-ui)/1.35 var(--f-ui);-webkit-text-size-adjust:100%;text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-width:0}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:1px dotted var(--ink);outline-offset:1px}

/* ---------- buttons */
.btn{background:var(--btn);border:1px solid var(--btn-b);border-radius:0;min-height:var(--btn-h);
  padding:2px 12px;min-width:75px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn:hover:not(:disabled){background:var(--hov);border-color:var(--focus)}
.btn.def{border-color:var(--focus);box-shadow:inset 0 0 0 1px var(--focus)}
.btn:disabled{background:var(--dis-bg);border-color:var(--dis-b);color:var(--dis-ink);cursor:default;box-shadow:none}
.tb{background:none;border:1px solid transparent;padding:2px 6px;min-height:var(--btn-h);display:inline-flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.tb:hover:not(:disabled){background:var(--hov);border-color:#cce4f7}
.tb img{width:16px;height:16px}
.tb:disabled{color:var(--dis-ink);cursor:default}
.tb:disabled img{filter:grayscale(1);opacity:.5}
.lnk{background:none;border:0;padding:4px 0;color:var(--grey-label);text-decoration:underline;cursor:pointer;font-size:11px}
.tb.down{background:#cce4f7;border-color:#99c9ef}

/* ---------- start screen (choose Test or Practice) */
.start{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px 0}
.start h1{font:400 24px/1.25 var(--f-q);margin:0;text-align:center;text-wrap:balance}
.start .org{margin:-12px 0 0;color:var(--ink-dim);text-align:center}
.modes{display:grid;gap:12px;width:min(440px,100%)}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px 16px;background:var(--btn);border:1px solid var(--btn-b);cursor:pointer;min-height:64px}
.mode b{font-size:calc(var(--fs-ui) + 4px);font-weight:600}
.mode span{color:var(--ink-dim)}
.mode:hover{background:var(--hov);border-color:var(--focus)}
.mode.def{border-color:var(--focus);box-shadow:inset 0 0 0 1px var(--focus)}
.start .lnk{margin-top:4px}

/* ---------- top strip */
.top{display:flex;align-items:center;gap:8px;padding:6px 0 7px;border-bottom:1px solid var(--line);flex:none}
.qlabel{white-space:nowrap;flex:none}
.diagram{flex:1;min-width:0;display:grid;gap:2px;grid-auto-rows:var(--sq-h)}
.sq{display:block;border:0;padding:0;margin:0;min-width:0;background:var(--unans);cursor:pointer;border-radius:0}
.sq.a{background:var(--ans)} .sq.ok{background:var(--ok)} .sq.bad{background:var(--bad)}
.sq.cur{box-shadow:inset 0 0 0 2px var(--cur),inset 0 0 0 3px var(--win)}
.sq.lock{cursor:default}

/* ---------- question */
.main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 0}
.q{display:flex;flex-direction:column;gap:12px;min-width:0}
.form{background:var(--win);border:1px solid var(--q-border);padding:4px 6px 6px;font:var(--fs-q)/1.2 var(--f-q);
  white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.form img,.ct img,.itm img,.base img{max-width:100%;height:auto;vertical-align:top}
.choices{display:flex;flex-direction:column;gap:13px}
.choice{display:flex;align-items:flex-start;gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.choice.dis{cursor:default}
.mark{flex:none;width:13px;height:13px;margin-top:4px;border:1px solid #333;background:var(--win);position:relative}
.mark.r{border-radius:50%}
.choice.on .mark.r::after{content:"";position:absolute;inset:2px;border-radius:50%;background:#000}
.choice.on .mark.c::after{content:"";position:absolute;left:3px;top:0;width:4px;height:8px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg)}
.choice.dis .mark{border-color:#bcbcbc;background:#f4f4f4}
.choice.dis.on .mark::after{border-color:#6d6d6d;background:#6d6d6d}
.choice.dis.on .mark.c::after{background:none}
.ct{flex:1;min-width:0;background:var(--win);padding:5px 5px 4px;font:var(--fs-q)/1.2 var(--f-q);white-space:pre-wrap;overflow-wrap:anywhere}
.choice.on .ct{background:var(--sel)}
@media (pointer:coarse){ .mark{width:20px;height:20px;margin-top:2px} .choice.on .mark.r::after{inset:4px}
  .choice.on .mark.c::after{left:6px;top:1px;width:6px;height:12px} }

/* ---------- classify / match */
.cls,.mt{display:grid;grid-template-columns:minmax(0,1fr) 2px minmax(0,1fr);gap:0 10px;align-items:start}
.vsep{background:var(--line);align-self:stretch;width:2px}
.cats,.mrows,.pool{display:flex;flex-direction:column;min-width:0}
.cats{gap:20px} .pool{gap:13px;min-height:44px;align-self:stretch}
.cat-h{background:var(--cat);border:1px solid var(--q-border);border-bottom:0;padding:3px 5px;font:var(--fs-q)/1.2 var(--f-q);white-space:pre-wrap}
.cat-b{background:var(--cat);border:1px solid #000;min-height:48px;padding:9px 9px 38px;display:flex;flex-direction:column;gap:12px}
.itm{background:var(--win);border:1px solid var(--q-border);padding:4px 5px;font:var(--fs-q)/1.2 var(--f-q);white-space:pre-wrap;overflow-wrap:anywhere;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.ed .itm{cursor:grab}
.itm.ph{visibility:hidden}
.itm.picked{outline:2px solid var(--focus);outline-offset:1px}
.itm.lift{opacity:.35}
.drop.over .cat-b,.drop.over .mslot,.pool.over{box-shadow:inset 0 0 0 2px var(--focus)}
.mrows{gap:14px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 14px minmax(0,1fr);align-items:center}
.base{background:var(--win);border:1px solid var(--q-border);padding:4px 5px;font:var(--fs-q)/1.2 var(--f-q);white-space:pre-wrap;overflow-wrap:anywhere}
.conn{height:2px;background:var(--line)}
.mslot{background:var(--slot);border:1px solid #000;min-height:32px;padding:1px;display:flex;flex-direction:column}
.mslot .itm{border-color:#000}
.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;opacity:.9;box-shadow:0 6px 18px var(--shade);margin:0}

/* ---------- bottom bar */
.bot{flex:none;display:grid;grid-template-columns:auto auto auto auto 1fr auto;grid-template-areas:"sub nav res tim . fin";
  align-items:center;column-gap:35px;row-gap:6px;padding:7px 0 8px;border-top:1px solid var(--line)}
#bSubmit{grid-area:sub;min-width:104px} .nav{grid-area:nav;display:flex;gap:2px} .res{grid-area:res;white-space:nowrap}
.timer{grid-area:tim;display:flex;align-items:center;gap:4px} #bFinish{grid-area:fin}
#bCorrect{grid-area:tim;justify-self:start}
.qs-top .sw{display:flex;gap:2px;flex:none}
.tbox{position:relative;width:64px;height:17px;border:1px solid #000;background:var(--win);display:grid;place-items:center;
  font:700 11px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.tfill{position:absolute;left:0;top:0;bottom:0;background:var(--timer)}
.tbox span{position:relative}
.tbox.exp{color:var(--red)}
@media (pointer:coarse){ .tbox{width:78px;height:24px;font-size:13px} }

/* ---------- dialogs */
.ovl{position:fixed;inset:0;z-index:50;background:var(--shade);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--face);border:1px solid #7a7a7a;box-shadow:0 10px 30px var(--shade);max-width:100%;max-height:100%;display:flex;flex-direction:column;min-width:0}
.dlg-t{background:var(--win);padding:7px 10px;border-bottom:1px solid #dcdcdc;flex:none}
.dlg-b{padding:14px 16px 12px;display:flex;gap:12px;align-items:flex-start}
.dlg-btns{display:flex;gap:10px;justify-content:center;padding:4px 16px 12px;flex:none}
.dlg-btns.left{justify-content:flex-start;padding-top:8px}
.qico{flex:none;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7fa7da,#2c5aa0);color:#fff;
  display:grid;place-items:center;font:700 19px/1 var(--f-q);box-shadow:inset 0 0 0 1px #1d3f74}
.ico{width:14px;height:14px;display:inline-block;flex:none}
.brw{width:min(825px,100%);height:min(550px,100%)}
.br-list{flex:1;min-height:0;overflow:auto;margin:7px 7px 0;background:var(--win);border:1px solid var(--q-border);font-size:11px;-webkit-overflow-scrolling:touch}
.br-row{display:flex;gap:10px;padding:0 4px;line-height:14px;cursor:pointer;white-space:nowrap}
.br-n{flex:none;width:28px;text-align:right;font-variant-numeric:tabular-nums}
.br-t{overflow:hidden;text-overflow:ellipsis}
.br-row.done{color:var(--dis-ink)}
.br-row.cur{font-weight:700}
.br-row.sel{background:var(--list-sel);color:var(--win)}
@media (pointer:coarse){ .br-list{font-size:14px} .br-row{line-height:20px;padding:8px 6px} .br-t{white-space:normal} .br-row{white-space:normal} }
.about{width:min(560px,100%);height:min(440px,100%)}
.about-txt{flex:1;min-height:0;overflow:auto;margin:7px;padding:6px 8px;background:var(--win);border:1px solid var(--q-border);white-space:pre-wrap;font:12px/1.4 var(--f-ui);-webkit-user-select:text;user-select:text}

/* ---------- results */
.results{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:7px}
.tabs{display:flex;align-items:flex-end;flex:none;overflow-x:auto}
.tab{background:var(--face);border:1px solid var(--line);border-bottom:0;padding:2px 8px;margin-right:-1px;cursor:pointer;white-space:nowrap;min-height:calc(var(--btn-h) - 2px)}
.tab.sel{background:var(--face);position:relative;top:1px;z-index:1;padding-bottom:4px}
.tabpage{flex:1;min-height:0;border:1px solid var(--line);background:var(--face);display:flex;flex-direction:column}
.rbot{flex:none;display:flex;align-items:center;justify-content:space-between;padding:7px 0 8px}
.overall{padding:14px;display:flex;flex-wrap:wrap;gap:14px 25px;overflow:auto;align-items:flex-start}
.pie{flex:none;width:200px;height:200px}
.kv{display:grid;grid-template-columns:auto minmax(0,auto);column-gap:10px;row-gap:4px;font-family:var(--f-q);align-content:start;min-width:0}
.kv .k{color:var(--grey-label);text-align:right;font-size:28px;white-space:nowrap}
.kv .v{font-size:28px;overflow-wrap:anywhere}
.kv .k.s,.kv .v.s{font-size:19px;padding-top:22px}
@media (max-width:520px){ .pie{width:150px;height:150px} .kv .k,.kv .v{font-size:23px} .kv .k.s,.kv .v.s{font-size:16px} }
.qs{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 10px}
.qs-top{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);flex:none}
.qs-main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 2px}
.qs-det{flex:none;border-top:1px solid var(--line);padding:6px 0}
.qs-nav{flex:none;border-top:1px solid var(--line);padding:5px 0;display:flex;gap:2px}
.tblwrap{flex:1;min-height:0;overflow:auto;margin:7px;border:1px solid var(--q-border);background:var(--win)}
table.sec{border-collapse:collapse;font-size:11px;min-width:100%}
table.sec th{font-weight:400;text-align:left;padding:2px 6px;border-right:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5;background:var(--win);cursor:pointer;white-space:nowrap;position:sticky;top:0}
table.sec th.num,table.sec td.num{text-align:right;font-variant-numeric:tabular-nums}
table.sec td{padding:1px 6px;white-space:nowrap}
table.sec th .ar{color:var(--grey-label);font-size:9px;margin-left:6px}
table.sec th.blank{width:100%;cursor:default}
@media (pointer:coarse){ table.sec{font-size:14px} table.sec td{padding:6px 8px} table.sec th{padding:6px 8px} }

/* ---------- narrow screens (phones) */
@media (max-width:700px){
  .top{display:grid;grid-template-columns:1fr auto;grid-template-areas:"lab br" "dia dia";row-gap:6px}
  .top .qlabel{grid-area:lab} .top #bBrowse{grid-area:br} .top .diagram{grid-area:dia}
  .bot{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"sub nav nav" "res tim fin";column-gap:12px}
  .nav{justify-self:start} .timer,#bCorrect{justify-self:center}
  .cls,.mt{grid-template-columns:minmax(0,1fr);row-gap:16px}
  .vsep{width:auto;height:2px}
  .qs-top{display:grid;grid-template-columns:1fr;row-gap:6px}
}
@media (max-width:380px){ #bSubmit{min-width:84px} .btn{padding:2px 9px;min-width:64px} .bot{column-gap:8px} }
@media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto!important} }
</style>

    shuffle(ids);

  }
  var arrowCol = ui.sortCol >= 0 ? ui.sortCol : 0, arrow = ui.sortDir > 0 ? '▲' : '▼';
  var h = '<div class="tblwrap"><table class="sec"><thead><tr>' + cols.map(function (c, k) {
    return '<th class="' + (c.num ? 'num' : '') + '" data-col="' + k + '" scope="col">' + esc(c.h) + (k === arrowCol ? '<span class="ar">' + arrow + '</span>' : '') + '</th>';
  }).join('') + '<th class="blank" aria-hidden="true"></th></tr></thead><tbody>';
  rows.forEach(function (r) {
    h += '<tr>' + cols.map(function (c) {
      var v = r[c.f];
      if (c.f === 'r') v = pct(v); else if (c.f === 'got') v = dec2(v); else if (c.f === 'tot') v = num(v);
      return '<td class="' + (c.num ? 'num' : '') + '">' + esc(v) + '</td>';
    }).join('') + '<td></td></tr>';
  });
  tp.innerHTML = h + '</tbody></table></div>';
  $('table.sec thead', tp).onclick = function (e) {
    var th = e.target.closest('th[data-col]'); if (!th) return;
    var k = +th.dataset.col;
    if (ui.sortCol === k) ui.sortDir = -ui.sortDir; else { ui.sortCol = k; ui.sortDir = 1; }
    renderSections(tp);
  };
}

// ------------------------------------------------------------ keyboard
document.addEventListener('keydown', function (e) {
  if ($('.ovl')) { if (e.key === 'Escape') closeModal(); return; }
  if (!S) return;
  if (S.done) {
    if (ui.tab !== 1) return;
    if (e.key === 'F2') { e.preventDefault(); var p = $('#rPrev'); if (p && !p.disabled) p.click(); }
    if (e.key === 'F3') { e.preventDefault(); var n = $('#rNext'); if (n && !n.disabled) n.click(); }
    return;
  }
  if (e.key === 'F2') { e.preventDefault(); go(S.cur - 1); }
  else if (e.key === 'F3') { e.preventDefault(); go(S.cur + 1); }
  else if (e.key === 'Enter' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); submit(); }
});

// ------------------------------------------------------------ start
S = load();
render();
setInterval(tick, 250);
document.addEventListener('visibilitychange', tick);
window.addEventListener('resize', function () {
  var d = $('#diag') || $('#rdiag');
  if (d && S) layoutDiagram(d, S.it.length);
});
if (VARIANT === 'pwa' && 'serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
document.title = DATA.title;
})();
</script>
